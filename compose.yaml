services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: iro
      POSTGRES_PASSWORD: iro-local-test
      POSTGRES_DB: iro_test
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iro -d iro_test"]
      interval: 2s
      timeout: 3s
      retries: 20
